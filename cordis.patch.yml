# Browser bridge layer for the dsh `web` and `desktop` profiles.
#
# `dsh plugin --profile <name> add @shallbay/dsh-bridge-browser` registers
# this package's `dsh.bundle` manifest, so the loader applies this patch without
# any extra command-line option.
#
# Desktop users: the Desktop application owns the reserved `desktop` profile, but
# the CLI can still manage it once the application has been started at least once:
#
#     dsh plugin --profile desktop add @shallbay/dsh-bridge-browser
#
# then restart the application (menu: Restart App and Host). The Desktop host
# listens on 127.0.0.1:19387, so the extension's bridge address is
# ws://127.0.0.1:19387 (the bundled extension already probes that port).
#
# On first boot the plugin generates a bearer token and persists it at
# ~/.dsh/ext-bridge-token (chmod 0600). Chrome extensions connecting from a
# chrome-extension:// origin over loopback need no token; Firefox and remote
# deployments do. To pin a fixed token, set DSH_EXT_TOKEN and reference it below.
# Extension-created sessions default to the ~/.dsh/browser-sessions workspace.
# Set DSH_BROWSER_SESSION_WORKSPACE to choose another path, or to an empty
# string to keep those sessions Ungrouped.
# Sessions materialize only on the first message (deferSessionCreate defaults
# to true): opening the side panel without chatting leaves no session behind.
#
# Security: the bridge path carries its own token auth and refuses privileged
# gateway methods (settings/credentials/open-*) for non-loopback remotes. Do
# not run `dsh web --host 0.0.0.0` on untrusted networks with this layer.

- insert:
    - id: bridge-browser
      name: '@shallbay/dsh-bridge-browser'
      config:
        token: !!js process.env.DSH_EXT_TOKEN
        sessionWorkspacePath: !!js process.env.DSH_BROWSER_SESSION_WORKSPACE
        toolTimeoutMs: 90000
        snapshotMaxChars: 32000
        maxInteractiveItems: 60
